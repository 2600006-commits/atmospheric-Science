name: Auto Convert NetCDF4 to NetCDF3

on:
  push:
    paths:
      - '**.nc'
      - '!**_v3.nc' # 이미 변환된 파일이 올라올 때는 실행 방지

jobs:
  convert-nc-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install xarray netCDF4 scipy

      - name: Convert NetCDF4 to NetCDF3
        run: |
          import os
          import xarray as xr
          import glob

          # 폴더 내의 모든 .nc 파일 찾기
          nc_files = glob.glob('*.nc')
          
          for file in nc_files:
              # 이미 _v3.nc로 변환된 파일은 건너뛰기
              if not file.endswith('_v3.nc'):
                  print(f"변환 시작: {file}")
                  try:
                      ds = xr.open_dataset(file)
                      new_name = file.replace('.nc', '_v3.nc')
                      ds.to_netcdf(new_name, format='NETCDF3_64BIT')
                      print(f"변환 완료: {new_name}")
                  except Exception as e:
                      print(f"오류 발생 ({file}): {e}")
        shell: python

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *_v3.nc
          # 변경사항이 있을 때만 커밋
          git commit -m "Auto-converted NetCDF4 to NetCDF3" || echo "No changes to commit"
          git push
