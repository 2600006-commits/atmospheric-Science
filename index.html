<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기상청 일기도 분석 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/netcdfjs@0.7.0/dist/netcdfjs.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(226, 232, 240, 1); }
    </style>
</head>
<body class="text-slate-800">

<div class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-8">
        <h1 class="text-3xl font-bold text-blue-900">Meteorological Data Analyzer</h1>
        <p class="text-slate-500 mt-2">HGT 및 SLP 데이터 기상청 표준 일기도 시각화</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- 좌측 컨트롤 패널 -->
        <div class="lg:col-span-1 glass-panel rounded-2xl p-6 shadow-sm h-fit">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2">Data Settings</h2>
            
            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">1. NetCDF v3 (classic) 파일 첨부 (.nc)</label>
                <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-lg p-3 text-center transition">
                    <input type="file" id="fileInput" accept=".nc" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition">
                    <p class="text-xs text-slate-400 mt-1">또는 파일을 이 영역으로 드래그 앤 드롭</p>
                </div>
                <p class="text-xs text-amber-600 mt-1">⚠️ 브라우저 라이브러리 특성상 <b>NetCDF-4(HDF5)</b> 파일은 읽을 수 없습니다. classic(v3) 포맷으로 변환된 .nc만 지원됩니다.</p>
                <div id="fileInfo" class="hidden mt-3 text-xs bg-slate-50 border border-slate-200 rounded-lg p-3 text-slate-600 space-y-1"></div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">2. 분석 요소 선택</label>
                <div class="flex space-x-2">
                    <button id="btnHGT" class="flex-1 py-2 px-4 rounded-lg font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 transition" onclick="setDataType('HGT')">HGT (고도)</button>
                    <button id="btnSLP" class="flex-1 py-2 px-4 rounded-lg font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 transition" onclick="setDataType('SLP')">SLP (기압)</button>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">3. 지역 선택</label>
                <select id="regionSelect" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="east_asia">동아시아 (East Asia)</option>
                    <option value="global">전세계 (Global)</option>
                    <option value="north_europe">북유럽 (Northern Europe)</option>
                </select>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">4. 날짜 및 고도</label>
                <select id="timeSelect" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 outline-none mb-2 disabled:opacity-50">
                    <option value="">데이터를 먼저 업로드하세요</option>
                </select>
                <select id="levelSelect" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 outline-none hidden disabled:opacity-50">
                    <option value="">고도(hPa) 선택</option>
                </select>
            </div>

            <button onclick="plotData()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition">
                일기도 그리기
            </button>
        </div>

        <!-- 우측 그래프 패널 -->
        <div class="lg:col-span-3 flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-2 shadow-sm min-h-[700px] flex items-center justify-center relative bg-white">
                <div id="plotDiv" class="w-full h-full min-h-[680px]"></div>
                <div id="loading" class="absolute inset-0 bg-white/90 flex items-center justify-center hidden rounded-2xl z-10">
                    <div class="flex flex-col items-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 mb-4"></div>
                        <p class="text-blue-600 font-semibold" id="loadingText">데이터를 분석 중입니다...</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-end">
                <button onclick="exportForGemini()" class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-2 px-6 rounded-lg shadow hover:opacity-90 transition">
                    분석 및 질문 (Gemini 스크립트 복사)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentDataType = ''; 
    let ncData = null;
    let mapTraceData = null;
    let lons = [], lats = [], times = [], levels = [];
    let varInfo = { lat: '', lon: '', time: '', level: '', data: '' };

    function setDataType(type) {
        currentDataType = type;
        document.getElementById('btnHGT').className = 'flex-1 py-2 px-4 rounded-lg font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 transition';
        document.getElementById('btnSLP').className = 'flex-1 py-2 px-4 rounded-lg font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 transition';
        document.getElementById(`btn${type}`).className = 'flex-1 py-2 px-4 rounded-lg font-medium bg-blue-600 text-white transition';
        const levelEl = document.getElementById('levelSelect');
        levelEl.classList.toggle('hidden', type !== 'HGT');
    }

    // 배열 평탄화 함수 (다차원 배열이 들어올 경우 강제로 1차원으로 풀기)
    function flattenArray(arr) {
        if (!arr || typeof arr !== 'object') return [];
        let flat = [];
        for (let i = 0; i < arr.length; i++) {
            flat.push(Number(arr[i]));
        }
        return flat;
    }

    // 지도 데이터 로드
    async function fetchMapLine() {
        if (mapTraceData) return mapTraceData;
        try {
            const response = await fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json');
            const geojson = await response.json();
            let mapX = [], mapY = [];
            
            geojson.features.forEach(f => {
                const extractPoly = (poly) => {
                    let prevLon = null;
                    poly.forEach(coord => {
                        let lon = coord[0];
                        if (lon < 0) lon += 360; // 경도 0~360 매핑
                        if (prevLon !== null && Math.abs(lon - prevLon) > 180) {
                            mapX.push(null); mapY.push(null);
                        }
                        mapX.push(lon); mapY.push(coord[1]);
                        prevLon = lon;
                    });
                    mapX.push(null); mapY.push(null); 
                };
                if(f.geometry.type === 'Polygon') f.geometry.coordinates.forEach(extractPoly);
                else if(f.geometry.type === 'MultiPolygon') f.geometry.coordinates.forEach(m => m.forEach(extractPoly));
            });

            mapTraceData = { x: mapX, y: mapY, type: 'scatter', mode: 'lines', line: { color: '#334155', width: 1.5 }, hoverinfo: 'none', showlegend: false };
            return mapTraceData;
        } catch (e) {
            return null;
        }
    }

    function findVariable(names) {
        const vars = ncData.header.variables;
        for (let n of names) {
            let found = vars.find(v => v.name.toLowerCase() === n.toLowerCase());
            if (found) return found.name;
        }
        return null;
    }

    // 시간 변수의 units 속성("hours since 1800-01-01 00:00:00" 등)을 읽어
    // 실제 기준일자를 파싱한다. 속성이 없으면 NCEP 계열 기본값(1800-01-01)으로 대체.
    function parseTimeUnits(timeVarName) {
        let result = { baseDate: new Date('1800-01-01T00:00:00Z'), unitMs: 3600 * 1000 };
        const varObj = ncData.header.variables.find(v => v.name === timeVarName);
        if (!varObj || !varObj.attributes) return result;

        const unitsAttr = varObj.attributes.find(a => a.name === 'units');
        if (!unitsAttr) return result;

        const unitsStr = Array.isArray(unitsAttr.value) ? unitsAttr.value.join('') : String(unitsAttr.value);
        const match = unitsStr.match(/(hours|days|minutes|seconds)\s+since\s+([\d-]+)[T\s]?([\d:]*)/i);
        if (!match) return result;

        const unitWord = match[1].toLowerCase();
        const unitMsMap = { seconds: 1000, minutes: 60 * 1000, hours: 3600 * 1000, days: 86400 * 1000 };
        const timePart = match[3] && match[3].length > 0 ? match[3] : '00:00:00';
        const parsedBase = new Date(`${match[2]}T${timePart}Z`);

        if (!isNaN(parsedBase.getTime())) {
            result.baseDate = parsedBase;
            result.unitMs = unitMsMap[unitWord] || result.unitMs;
        }
        return result;
    }

    // NetCDF-3(classic)인지 NetCDF-4(HDF5 기반)인지 매직 넘버로 미리 확인.
    // netcdfjs 라이브러리는 classic 포맷만 지원하므로, HDF5 파일이면 파싱 전에 바로 안내한다.
    function detectNetcdfFormat(buffer) {
        const bytes = new Uint8Array(buffer.slice(0, 4));
        const magic = String.fromCharCode(...bytes);
        if (magic === 'CDF\x01' || magic === 'CDF\x02' || magic === 'CDF\x05') return 'classic';
        if (bytes[0] === 0x89 && bytes[1] === 0x48 && bytes[2] === 0x44 && bytes[3] === 0x46) return 'hdf5'; // \x89HDF
        return 'unknown';
    }

    function handleFile(file) {
        if (!file) return;
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('loadingText').innerText = "파일을 해독 중입니다...";

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const buffer = evt.target.result;
                const format = detectNetcdfFormat(buffer);

                if (format === 'hdf5') {
                    throw new Error(
                        "이 파일은 NetCDF-4(HDF5 기반) 포맷입니다. 브라우저용 netcdfjs 라이브러리는 " +
                        "NetCDF-3(classic) 포맷만 읽을 수 있습니다. NCO(ncks -3 in.nc out.nc) 또는 " +
                        "Python xarray(ds.to_netcdf('out.nc', format='NETCDF3_CLASSIC'))로 변환 후 다시 업로드해주세요."
                    );
                }
                if (format === 'unknown') {
                    throw new Error("NetCDF 파일로 인식되지 않습니다. 확장자와 포맷을 확인해주세요.");
                }

                // netcdfjs는 버전에 따라 생성자 노출 방식이 다름
                // - 0.x 버전(현재 CDN에 로드된 0.7.0 포함): default export → new netcdfjs(buffer)
                // - 2.0.0 이상: named export → new netcdfjs.NetCDFReader(buffer)
                // 두 경우를 모두 시도해서 어떤 버전이 로드되어도 동작하도록 함.
                if (typeof netcdfjs === 'function') {
                    ncData = new netcdfjs(buffer);
                } else if (netcdfjs && typeof netcdfjs.NetCDFReader === 'function') {
                    ncData = new netcdfjs.NetCDFReader(buffer);
                } else if (netcdfjs && typeof netcdfjs.default === 'function') {
                    ncData = new netcdfjs.default(buffer);
                } else {
                    throw new Error("netcdfjs 라이브러리를 초기화할 수 없습니다. 스크립트 로드 상태를 확인해주세요.");
                }

                varInfo.lat = findVariable(['lat', 'latitude']);
                varInfo.lon = findVariable(['lon', 'longitude']);
                varInfo.time = findVariable(['time']);
                varInfo.level = findVariable(['level', 'lev', 'plev']);

                if (!varInfo.lat || !varInfo.lon) {
                    throw new Error("위/경도(lat, lon) 변수를 찾을 수 없습니다. 변수명을 확인해주세요.");
                }

                // [오류 해결 1] 모든 축 데이터를 강제로 플랫 배열로 변환
                lats = flattenArray(ncData.getDataVariable(varInfo.lat));
                lons = flattenArray(ncData.getDataVariable(varInfo.lon));

                const timeSelect = document.getElementById('timeSelect');
                timeSelect.innerHTML = '';
                if (varInfo.time) {
                    times = flattenArray(ncData.getDataVariable(varInfo.time));
                    const { baseDate, unitMs } = parseTimeUnits(varInfo.time);
                    times.forEach((t, idx) => {
                        let d = new Date(baseDate.getTime() + t * unitMs);
                        const label = `${d.getUTCFullYear()}년 ${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${String(d.getUTCHours()).padStart(2,'0')}UTC`;
                        timeSelect.add(new Option(label, idx));
                    });
                } else {
                    times = [0];
                    timeSelect.add(new Option('단일 시점', 0));
                }

                const levelSelect = document.getElementById('levelSelect');
                if (varInfo.level) {
                    levels = flattenArray(ncData.getDataVariable(varInfo.level));
                    levelSelect.innerHTML = '';
                    levels.forEach((l, idx) => levelSelect.add(new Option(`${l} hPa`, idx)));
                    setDataType('HGT');
                } else {
                    setDataType('SLP');
                }

                // 로드된 파일 정보를 패널에 표시 (디버깅/확인용)
                const info = document.getElementById('fileInfo');
                info.classList.remove('hidden');
                info.innerHTML = `
                    <div><b>파일명:</b> ${file.name}</div>
                    <div><b>격자 크기:</b> ${lats.length} × ${lons.length} (위도 × 경도)</div>
                    <div><b>시간 스텝:</b> ${times.length}개</div>
                    <div><b>연직 레벨:</b> ${varInfo.level ? levels.length + '개 (' + levels.join(', ') + ' hPa)' : '없음 (지상 자료)'}</div>
                    <div><b>변수 목록:</b> ${ncData.header.variables.map(v => v.name).join(', ')}</div>
                `;

                // [자동화 1] 위/경도 범위를 보고 전지구 자료면 지역을 'global'로 자동 전환
                autoSelectRegion();

                // [자동화 2] 파일을 첨부하면 버튼 클릭 없이 바로 일기도를 그림 (첫 시간 스텝 기준)
                document.getElementById('timeSelect').selectedIndex = 0;
                if (varInfo.level) document.getElementById('levelSelect').selectedIndex = 0;
                plotData();

            } catch (err) {
                alert("오류: " + err.message);
                console.error(err);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // 위/경도 데이터 범위를 보고 동아시아 확대 화면이 아닌 전지구 화면이 맞는지 자동 판단
    function autoSelectRegion() {
        if (!lons.length || !lats.length) return;
        const lonMin = Math.min(...lons), lonMax = Math.max(...lons);
        const latMin = Math.min(...lats), latMax = Math.max(...lats);
        const regionSelect = document.getElementById('regionSelect');
        // 경도 범위가 300도 이상(전지구 격자)이면 global, 아니면 기존 선택 유지
        if ((lonMax - lonMin) >= 300 || (latMax - latMin) >= 150) {
            regionSelect.value = 'global';
        }
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        handleFile(e.target.files[0]);
    });

    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(evt => {
        dropZone.addEventListener(evt, e => {
            e.preventDefault(); e.stopPropagation();
            dropZone.classList.add('border-blue-500', 'bg-blue-50');
        });
    });
    ['dragleave', 'drop'].forEach(evt => {
        dropZone.addEventListener(evt, e => {
            e.preventDefault(); e.stopPropagation();
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        });
    });
    dropZone.addEventListener('drop', e => {
        const file = e.dataTransfer.files[0];
        if (file) {
            document.getElementById('fileInput').files = e.dataTransfer.files;
            handleFile(file);
        }
    });

    async function plotData() {
        if (!ncData || !currentDataType) return alert("파일을 먼저 업로드하세요.");
        
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('loadingText').innerText = "기상청 스타일로 렌더링 중입니다...";

        setTimeout(async () => {
            try {
                const timeIdx = parseInt(document.getElementById('timeSelect').value);
                const levelIdx = parseInt(document.getElementById('levelSelect').value) || 0;
                varInfo.data = findVariable(currentDataType === 'HGT' ? ['hgt', 'z'] : ['slp', 'msl', 'prmsl']);
                
                // [오류 해결 2] 메인 데이터도 플랫 배열로 변환
                const rawData = flattenArray(ncData.getDataVariable(varInfo.data));
                const numLats = lats.length;
                const numLons = lons.length;
                const numLevels = varInfo.level ? levels.length : 1;

                let scale = 1, offset = 0, missingValue = null;
                const varObj = ncData.header.variables.find(v => v.name === varInfo.data);
                if (varObj && varObj.attributes) {
                    varObj.attributes.forEach(attr => {
                        let val = Array.isArray(attr.value) ? attr.value[0] : attr.value;
                        if (attr.name === 'scale_factor') scale = Number(val);
                        if (attr.name === 'add_offset') offset = Number(val);
                        if (attr.name === 'missing_value' || attr.name === '_FillValue') missingValue = Number(val);
                    });
                }

                let yArray = [...lats];
                let xArray = [...lons];
                let zArray = [];

                for (let i = 0; i < numLats; i++) {
                    let row = [];
                    for (let j = 0; j < numLons; j++) {
                        // NCEP 배열 인덱스
                        let idx = varInfo.level 
                            ? (timeIdx * numLevels * numLats * numLons) + (levelIdx * numLats * numLons) + (i * numLons) + j 
                            : (timeIdx * numLats * numLons) + (i * numLons) + j;
                        
                        let val = rawData[idx];
                        
                        if (isNaN(val) || (missingValue !== null && Math.abs(val - missingValue) < 0.1)) {
                            row.push(null);
                        } else {
                            val = (val * scale) + offset;
                            if (currentDataType === 'SLP' && val > 50000) val = val / 100;
                            row.push(val);
                        }
                    }
                    zArray.push(row);
                }

                if (yArray[0] > yArray[yArray.length - 1]) {
                    yArray.reverse();
                    zArray.reverse();
                }

                const mapTrace = await fetchMapLine();

                const region = document.getElementById('regionSelect').value;
                let lonRange = [90, 160], latRange = [15, 55]; 
                if (region === 'global') { lonRange = [0, 360]; latRange = [-90, 90]; }
                else if (region === 'north_europe') { lonRange = [-10, 40]; latRange = [50, 70]; }

                // 파란색 등압선 설정
                const contourInterval = currentDataType === 'SLP' ? 4 : 60;
                
                const contourTrace = {
                    z: zArray, x: xArray, y: yArray,
                    type: 'contour',
                    colorscale: [[0, '#2563eb'], [1, '#2563eb']], 
                    contours: {
                        coloring: 'lines',
                        showlabels: true,
                        labelfont: { family: 'Arial', size: 14, color: '#1e40af', weight: 'bold' },
                        size: contourInterval
                    },
                    line: { width: 1.5, smoothing: 1.3 },
                    showscale: false,
                    hovertemplate: '위도: %{y:.1f}°<br>경도: %{x:.1f}°<br>수치: %{z:.1f} <extra></extra>'
                };

                // 실제 KMA 일기도처럼 굵은 기준선(SLP 20hPa 간격, HGT 300gpm 간격)을 얇은 등압선 아래에 겹쳐 그림
                const boldInterval = currentDataType === 'SLP' ? 20 : 300;
                const boldContourTrace = {
                    z: zArray, x: xArray, y: yArray,
                    type: 'contour',
                    colorscale: [[0, '#1e3a8a'], [1, '#1e3a8a']],
                    contours: { coloring: 'lines', showlabels: false, size: boldInterval },
                    line: { width: 3, smoothing: 1.3 },
                    showscale: false,
                    hoverinfo: 'skip'
                };

                // 고/저기압 마커
                let annotations = [];
                let windowSize = Math.max(2, Math.floor(xArray.length / 25)); 
                
                for (let i = windowSize; i < yArray.length - windowSize; i+=3) {
                    for (let j = windowSize; j < xArray.length - windowSize; j+=3) {
                        let val = zArray[i][j];
                        if (val === null) continue;

                        let isMax = true, isMin = true;
                        for(let wi = -windowSize; wi <= windowSize; wi++) {
                            for(let wj = -windowSize; wj <= windowSize; wj++) {
                                if (wi===0 && wj===0) continue;
                                let ni = i + wi, nj = j + wj;
                                if (ni < 0 || ni >= yArray.length || nj < 0 || nj >= xArray.length) continue;
                                
                                let nVal = zArray[ni][nj];
                                if (nVal === null) continue;
                                if (val <= nVal) isMax = false;
                                if (val >= nVal) isMin = false;
                            }
                        }

                        let lon = xArray[j], lat = yArray[i];
                        let inRegion = (lon >= lonRange[0] && lon <= lonRange[1] && lat >= latRange[0] && lat <= latRange[1]);

                        if (inRegion) {
                            if (isMax && (currentDataType !== 'SLP' || val > 1000)) {
                                annotations.push({
                                    x: lon, y: lat,
                                    text: `<b style="color:blue;font-size:26px;">H</b><br><span style="color:blue;font-size:14px;font-weight:bold;">${Math.round(val)}</span>`,
                                    showarrow: false
                                });
                                j += windowSize; 
                            } else if (isMin && (currentDataType !== 'SLP' || val < 1015)) {
                                annotations.push({
                                    x: lon, y: lat,
                                    text: `<b style="color:red;font-size:26px;">L</b><br><span style="color:red;font-size:14px;font-weight:bold;">${Math.round(val)}</span>`,
                                    showarrow: false
                                });
                                j += windowSize; 
                            }
                        }
                    }
                }

                const layout = {
                    title: { text: currentDataType === 'HGT' ? '지위 고도 선도 (Geopotential Height)' : '지상 일기도 (Surface Pressure)', font: { size: 22, bold: true } },
                    xaxis: { title: '경도 (Longitude)', range: lonRange, showgrid: true, gridcolor: '#e2e8f0', zeroline: false },
                    yaxis: { title: '위도 (Latitude)', range: latRange, scaleanchor: 'x', scaleratio: 1, showgrid: true, gridcolor: '#e2e8f0', zeroline: false },
                    margin: { l: 50, r: 50, b: 50, t: 80 },
                    paper_bgcolor: 'white',
                    plot_bgcolor: 'white',
                    annotations: annotations
                };

                const plotDataArray = mapTrace ? [boldContourTrace, contourTrace, mapTrace] : [boldContourTrace, contourTrace];
                Plotly.newPlot('plotDiv', plotDataArray, layout);

            } catch (err) {
                alert("일기도 렌더링 오류: " + err.message);
                console.error(err);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }, 100);
    }

    function exportForGemini() {
        const plot = document.getElementById('plotDiv');
        if (!plot.data) return alert("그래프를 먼저 생성해주세요.");
        
        const dateStr = document.getElementById('timeSelect').options[document.getElementById('timeSelect').selectedIndex].text;
        const promptText = `첨부한 ${dateStr} 기준의 ${currentDataType} 일기도 이미지를 바탕으로 다음을 분석해 줘:\n1. 현재 해당 지역의 전반적인 기상 상황 해석\n2. 기압계나 고도장의 주요 특징 (H, L 기압 중심 위치 등)\n3. 이로 인해 예상되는 날씨 변화`;

        navigator.clipboard.writeText(promptText).then(() => {
            Plotly.downloadImage(plot, {format: 'png', width: 1000, height: 800, filename: `KMA_Map_${currentDataType}`});
            alert("✅ 질문 스크립트가 복사되었고 일기도가 다운로드 되었습니다!\n제미나이 채팅창에 이미지를 첨부하고 Ctrl+V (붙여넣기) 하세요.");
        });
    }
</script>
