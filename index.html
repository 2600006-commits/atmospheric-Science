<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기상청 일기도 분석 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/netcdfjs@0.7.0/dist/netcdfjs.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(226, 232, 240, 1); }
    </style>
</head>
<body class="text-slate-800">

<div class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-8">
        <h1 class="text-3xl font-bold text-blue-900">Meteorological Data Analyzer</h1>
        <p class="text-slate-500 mt-2">HGT 및 SLP 파일 기상청 일기도 스타일 시각화</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- 좌측 컨트롤 패널 -->
        <div class="lg:col-span-1 glass-panel rounded-2xl p-6 shadow-sm h-fit">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2">Data Settings</h2>
            
            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">1. V3 변환 파일 첨부 (.nc)</label>
                <input type="file" id="fileInput" accept=".nc" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition">
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">2. 분석 요소 선택</label>
                <div class="flex space-x-2">
                    <button id="btnHGT" class="flex-1 py-2 px-4 rounded-lg font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 transition" onclick="setDataType('HGT')">HGT (고도)</button>
                    <button id="btnSLP" class="flex-1 py-2 px-4 rounded-lg font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 transition" onclick="setDataType('SLP')">SLP (기압)</button>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">3. 지역 선택</label>
                <select id="regionSelect" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="east_asia">동아시아 (East Asia)</option>
                    <option value="global">전세계 (Global)</option>
                    <option value="north_europe">북유럽 (Northern Europe)</option>
                </select>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">4. 날짜 및 고도</label>
                <select id="timeSelect" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 outline-none mb-2 disabled:opacity-50">
                    <option value="">데이터를 먼저 업로드하세요</option>
                </select>
                <select id="levelSelect" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 outline-none hidden disabled:opacity-50">
                    <option value="">고도(hPa) 선택</option>
                </select>
            </div>

            <button onclick="plotData()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition">
                일기도 그리기
            </button>
        </div>

        <!-- 우측 그래프 패널 -->
        <div class="lg:col-span-3 flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-2 shadow-sm min-h-[700px] flex items-center justify-center relative">
                <div id="plotDiv" class="w-full h-full min-h-[680px]"></div>
                <div id="loading" class="absolute inset-0 bg-white/80 flex items-center justify-center hidden rounded-2xl z-10">
                    <div class="flex flex-col items-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 mb-4"></div>
                        <p class="text-blue-600 font-semibold" id="loadingText">데이터를 분석 중입니다...</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-end">
                <button onclick="exportForGemini()" class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-2 px-6 rounded-lg shadow hover:opacity-90 transition">
                    분석 및 질문 (Gemini 스크립트 복사)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentDataType = ''; 
    let ncData = null;
    let mapTraceData = null; // 지도 윤곽선 데이터 캐싱
    let lons = [], lats = [], times = [], levels = [];
    let varInfo = { lat: '', lon: '', time: '', level: '', data: '' };

    function setDataType(type) {
        currentDataType = type;
        document.getElementById('btnHGT').className = 'flex-1 py-2 px-4 rounded-lg font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 transition';
        document.getElementById('btnSLP').className = 'flex-1 py-2 px-4 rounded-lg font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 transition';
        document.getElementById(`btn${type}`).className = 'flex-1 py-2 px-4 rounded-lg font-medium bg-blue-600 text-white transition';
        document.getElementById('levelSelect').style.display = type === 'HGT' ? 'block' : 'none';
    }

    // 1. 세계 지도 윤곽선 (GeoJSON) 불러오기 함수
    async function fetchMapLine() {
        if (mapTraceData) return mapTraceData;
        try {
            const response = await fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json');
            const geojson = await response.json();
            let mapX = [], mapY = [];
            
            geojson.features.forEach(f => {
                const extractPoly = (poly) => {
                    poly.forEach(coord => {
                        let lon = coord[0];
                        if(lon < 0) lon += 360; // 기상청 NCEP 데이터 형식(0~360)에 맞게 경도 보정
                        mapX.push(lon); 
                        mapY.push(coord[1]);
                    });
                    mapX.push(null); mapY.push(null); // 선 끊기
                };
                if(f.geometry.type === 'Polygon') f.geometry.coordinates.forEach(extractPoly);
                else if(f.geometry.type === 'MultiPolygon') f.geometry.coordinates.forEach(m => m.forEach(extractPoly));
            });

            mapTraceData = {
                x: mapX, y: mapY,
                type: 'scatter', mode: 'lines',
                line: { color: '#333333', width: 1 },
                hoverinfo: 'none', showlegend: false
            };
            return mapTraceData;
        } catch (e) {
            console.warn("지도 윤곽선을 불러오지 못했습니다.", e);
            return null;
        }
    }

    // 2. 변수 이름 유연하게 찾기 (xarray 변환 대응)
    function findVariable(names) {
        const vars = ncData.header.variables;
        for (let n of names) {
            let found = vars.find(v => v.name.toLowerCase() === n.toLowerCase());
            if (found) return found.name;
        }
        return null;
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('loadingText').innerText = "파일을 파싱 중입니다...";
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                ncData = new netcdfjs(evt.target.result);
                
                varInfo.lat = findVariable(['lat', 'latitude']);
                varInfo.lon = findVariable(['lon', 'longitude']);
                varInfo.time = findVariable(['time']);
                varInfo.level = findVariable(['level', 'lev']);
                
                lats = ncData.getDataVariable(varInfo.lat);
                lons = ncData.getDataVariable(varInfo.lon);
                times = ncData.getDataVariable(varInfo.time);
                
                const timeSelect = document.getElementById('timeSelect');
                timeSelect.innerHTML = '';
                const baseDate = new Date('1800-01-01T00:00:00Z');
                times.forEach((t, idx) => {
                    let d = new Date(baseDate.getTime() + t * 3600 * 1000);
                    timeSelect.add(new Option(`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`, idx));
                });

                if (varInfo.level) {
                    levels = ncData.getDataVariable(varInfo.level);
                    const levelSelect = document.getElementById('levelSelect');
                    levelSelect.innerHTML = '';
                    levels.forEach((l, idx) => levelSelect.add(new Option(`${l} hPa`, idx)));
                    setDataType('HGT');
                } else {
                    setDataType('SLP');
                }
                
                alert("파일이 로드되었습니다. '일기도 그리기'를 클릭하세요.");
            } catch (err) {
                alert("파일 파싱 오류: " + err.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // 3. 메인 일기도 렌더링 함수
    async function plotData() {
        if (!ncData || !currentDataType) return alert("파일을 먼저 업로드하세요.");
        
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('loadingText').innerText = "지도와 일기도를 합성 중입니다...";

        setTimeout(async () => {
            try {
                const timeIdx = parseInt(document.getElementById('timeSelect').value);
                const levelIdx = parseInt(document.getElementById('levelSelect').value) || 0;
                varInfo.data = findVariable(currentDataType === 'HGT' ? ['hgt', 'z'] : ['slp', 'msl', 'prmsl']);
                
                const rawData = ncData.getDataVariable(varInfo.data);
                const numLats = lats.length;
                const numLons = lons.length;
                const numLevels = varInfo.level ? levels.length : 1;

                let zData = [];
                for (let i = 0; i < numLats; i++) {
                    let row = [];
                    for (let j = 0; j < numLons; j++) {
                        // NCEP 배열 구조 매핑
                        let idx = varInfo.level 
                            ? (timeIdx * numLevels * numLats * numLons) + (levelIdx * numLats * numLons) + (i * numLons) + j 
                            : (timeIdx * numLats * numLons) + (i * numLons) + j;
                        
                        let val = rawData[idx];
                        // 결측치 필터링 및 단위 보정 (Pa -> hPa)
                        if (isNaN(val) || val <= -32000 || val >= 32000) val = null;
                        else if (currentDataType === 'SLP' && val > 1500) val = val / 100;
                        row.push(val);
                    }
                    zData.push(row);
                }

                // 4. 지도 배경 생성
                const mapTrace = await fetchMapLine();

                // 5. 등압선(Contour) 생성 (첨부 이미지 스타일 적용)
                const contourTrace = {
                    z: zData,
                    x: lons,
                    y: lats,
                    type: 'contour',
                    colorscale: [[0, 'blue'], [1, 'blue']], // 선 색상을 파란색으로 통일
                    contours: {
                        coloring: 'lines', // 면 채우기 없이 선만 표시
                        showlabels: true,
                        labelfont: { family: 'Arial', size: 13, color: 'blue' }
                    },
                    line: { width: 1.5, smoothing: 1.3 },
                    showscale: false, // 컬러바 숨김
                    hovertemplate: '위도: %{y:.1f}°<br>경도: %{x:.1f}°<br>수치: %{z:.1f} <extra></extra>'
                };

                // 6. H(고기압) / L(저기압) 극값 마커 생성
                let annotations = [];
                let windowSize = 5; // 극값을 찾는 반경 크기
                for (let i = windowSize; i < numLats - windowSize; i++) {
                    for (let j = windowSize; j < numLons - windowSize; j++) {
                        let val = zData[i][j];
                        if (val === null) continue;

                        let isMax = true, isMin = true;
                        for(let wi = -windowSize; wi <= windowSize; wi++) {
                            for(let wj = -windowSize; wj <= windowSize; wj++) {
                                if (wi===0 && wj===0) continue;
                                let nVal = zData[i+wi][j+wj];
                                if (nVal === null) continue;
                                if (val <= nVal) isMax = false;
                                if (val >= nVal) isMin = false;
                            }
                        }

                        if (isMax) {
                            annotations.push({ x: lons[j], y: lats[i], text: '<b style="color:blue;font-size:26px;">H</b><br><span style="color:blue;font-size:14px;">' + Math.round(val) + '</span>', showarrow: false });
                        } else if (isMin) {
                            annotations.push({ x: lons[j], y: lats[i], text: '<b style="color:red;font-size:26px;">L</b><br><span style="color:red;font-size:14px;">' + Math.round(val) + '</span>', showarrow: false });
                        }
                    }
                }

                // 7. 지역 범위 및 레이아웃 설정
                const region = document.getElementById('regionSelect').value;
                let lonRange = [100, 150], latRange = [20, 50]; // 기본: 동아시아
                if (region === 'global') { lonRange = [0, 360]; latRange = [-90, 90]; }
                else if (region === 'north_europe') { lonRange = [-10, 40]; latRange = [50, 70]; }

                const layout = {
                    title: { text: currentDataType === 'HGT' ? '지위 고도 선도 (Geopotential Height)' : '지상 일기도 (Surface Pressure)', font: { size: 22, bold: true } },
                    xaxis: { title: '경도', range: lonRange },
                    yaxis: { title: '위도', range: latRange, scaleanchor: 'x', scaleratio: 1 }, // 실제 지도 비율 유지
                    margin: { l: 40, r: 40, b: 40, t: 60 },
                    paper_bgcolor: 'white',
                    plot_bgcolor: '#fcfcfc', // 바다 배경색 살짝 추가
                    annotations: annotations // H, L 마커 삽입
                };

                const plotDataArray = mapTrace ? [mapTrace, contourTrace] : [contourTrace];
                Plotly.newPlot('plotDiv', plotDataArray, layout);

            } catch (err) {
                alert("일기도 생성 오류: " + err.message);
                console.error(err);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }, 100);
    }

    function exportForGemini() {
        const plot = document.getElementById('plotDiv');
        if (!plot.data) return alert("그래프를 먼저 생성해주세요.");
        
        const dateStr = document.getElementById('timeSelect').options[document.getElementById('timeSelect').selectedIndex].text;
        const promptText = `첨부한 ${dateStr} 기준의 ${currentDataType} 일기도 이미지를 바탕으로 다음을 분석해 줘:\n1. 현재 해당 지역의 전반적인 기상 상황 해석\n2. 기압계나 고도장의 주요 특징 (H, L 기압 중심 위치 등)\n3. 이로 인해 예상되는 날씨 변화`;

        navigator.clipboard.writeText(promptText).then(() => {
            Plotly.downloadImage(plot, {format: 'png', width: 900, height: 700, filename: `KMA_Map_${currentDataType}`});
            alert("✅ 질문 스크립트가 복사되었고 일기도가 다운로드 되었습니다!\n제미나이 채팅창에 이미지를 첨부하고 Ctrl+V (붙여넣기) 하세요.");
        });
    }
</script>
</body>
</html>
